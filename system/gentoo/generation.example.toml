# Unsigned recovery checkpoints; firmware and signing are separate later stages.
# Replace volume_group with the value in /etc/ms1504-root-identity (e.g. ms1504).
[system]
volume_group = "gentoo"
root_lv = "root"
home_lv = "home"
swap_lv = "swap"

[boot]
policy = "unsigned"
directory = "/boot"

[snapshots]
size_gib = 32
maximum_data_percent = 80
# Capacity follows the reserved budget and free LVM extents; never auto-prune.
retain_generations = "auto"

[state]
directory = "/var/lib/ms1504-generations"
