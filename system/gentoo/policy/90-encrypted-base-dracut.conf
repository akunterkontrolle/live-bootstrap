# Build a generic initramfs that can unlock LUKS2 and activate LVM at boot.
hostonly="no"
add_dracutmodules+=" crypt lvm resume "
# These drivers are built into the kernel and request firmware before switch_root.
# Include the legacy Wi-Fi symlink as well as its resolved firmware payload.
install_items+=" /lib/firmware/iwlwifi-7260-17.ucode /lib/firmware/intel/ibt-hw-37.7.bseq /lib/firmware/regulatory.db /lib/firmware/regulatory.db.p7s "
